[package]
name = "miracle-renpy-launcher"
version = "0.1.0"
description = "Portable Ren'Py game launcher with local-first save management"
authors = ["TheBlackCat47"]
edition = "2021"

[lib]
name = "miracle_renpy_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
tauri = { version = "2.8.4", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
